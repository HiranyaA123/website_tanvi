<!-- ============================================================
     PASSCODE GATE — shared snippet, identical on index.html,
     photobooth.html and bucketlist.html. Runs before the page
     paints, so the gate never flashes and the content never
     shows through it.
     ============================================================ -->
<script>
/* The passcode itself is NEVER in the source — only its SHA-256 hash.

   TO CHANGE THE PASSCODE:
     1. Open the site, open the browser console, and paste this:

          async function sha256(str) {
            const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
            return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
          }
          await sha256('newcode')

     2. Replace PASS_HASH below with the hex string it prints.
     3. Set PASS_LEN to the number of characters in the new code.
     4. Repeat in all three pages — this block is identical in each.

   Devices that remembered the OLD code relock themselves: what's stored in
   localStorage IS the old hash, so it stops matching PASS_HASH. */
const PASS_HASH = '120e90dfb21d132a40c6281f8c8f25331969559e200f589bfe8e775e333b5b3a';
const PASS_LEN  = 4;              // characters in the code — the field submits itself at this length
const GATE_KEY  = 'ldr_unlocked'; // localStorage key: remembers this device across visits

async function sha256(str) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
}
function gateUnlocked() {
  try { return localStorage.getItem(GATE_KEY) === PASS_HASH; } catch (e) { return false; }
}
function gateRemember() {
  try { localStorage.setItem(GATE_KEY, PASS_HASH); } catch (e) { /* private mode — unlock this visit only */ }
  document.documentElement.classList.add('unlocked');
}
async function gateCheck(value) {
  try { return (await sha256(String(value).trim())) === PASS_HASH; } catch (e) { return false; }
}
/* Wrong code: shake, flash coral, clear. No error text. */
function gateShake(input) {
  input.value = '';
  input.classList.remove('shake');
  void input.offsetWidth;                 // reflow, so the animation restarts on a repeat wrong code
  input.classList.add('shake');
  input.addEventListener('animationend', () => input.classList.remove('shake'), { once: true });
  input.focus();
}
if (gateUnlocked()) document.documentElement.classList.add('unlocked');
</script>

<style>

<!-- the one allowed dependency -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ============================================================
   BUCKET LIST — shared + editable via Supabase (behind the site passcode)
   Reuses the same config constants pattern as photobooth.html.
   Optimistic local UI + Realtime postgres_changes for live sync.
   ============================================================ */

/* ---- CONFIG (same values as photobooth.html) ---- */
const SUPABASE_URL      = 'https://fwttgzkmguvwwmeehdea.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_DjaMEHaadF0NNmMozllCdw_LrktMLQp';

const hasSupabase =
  SUPABASE_URL && SUPABASE_ANON_KEY &&
  SUPABASE_URL !== 'PASTE_URL_HERE' &&
  SUPABASE_ANON_KEY !== 'PASTE_ANON_KEY_HERE' &&
  window.supabase;
const sb = hasSupabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

/* ---- state ---- */
let items = [];                 // {id, text, done, created_at, done_at}
const elMap = new Map();        // id -> persistent DOM element (enables FLIP + keeps strike drawn)
let animating = false;          // suppress reorder/refetch mid strike-through
let errored = false;
let refetchTimer = null, pendingRefetch = false;

const $ = id => document.getElementById(id);

/* ---- data helpers ---- */
function normalize(row) {
  return { id: row.id, text: row.text, done: !!row.done, created_at: row.created_at, done_at: row.done_at };
}
// not-done first (created_at asc), then done at the bottom (done_at asc)
function sortItems(list) {
  const active = list.filter(i => !i.done)
    .sort((a, b) => new Date(a.created_at) - new Date(b.created_at));
  const done = list.filter(i => i.done)
    .sort((a, b) => new Date(a.done_at || 0) - new Date(b.done_at || 0));
  return active.concat(done);
}

/* ============================================================
   FETCH + RENDER
   ============================================================ */
async function fetchAndRender() {
  if (!sb) { errored = true; showMsg('this list needs a connection — check back in a bit ♡'); return; }
  try {
    const { data, error } = await sb.from('bucket_items').select('*');
    if (error) throw error;
    errored = false;
    const temps = items.filter(i => String(i.id).startsWith('tmp_'));   // keep unsynced optimistic adds
    items = data.map(normalize).concat(temps);
    render();
  } catch (e) {
    console.warn('[bucket] fetch failed', e);
    errored = true;
    if (!items.length) showMsg('couldn\'t reach our list right now — try again in a moment ♡');
  }
}

function makeEl(item) {
  const el = document.createElement('div');
  el.className = 'item enter';
  el.dataset.id = item.id;
  el.innerHTML =
    '<span class="marker">✦</span>' +
    '<span class="txt"></span>' +
    '<span class="ctrls">' +
      '<button class="ctrl done" title="done" aria-label="mark done">✓</button>' +
      '<button class="ctrl undo" title="undo" aria-label="undo">↩</button>' +
      '<button class="ctrl del"  title="delete" aria-label="delete">✕</button>' +
    '</span>';
  el.querySelector('.txt').textContent = item.text;
  el.querySelector('.done').addEventListener('click', e => { e.stopPropagation(); onDone(item.id); });
  el.querySelector('.undo').addEventListener('click', e => { e.stopPropagation(); onUndo(item.id); });
  el.querySelector('.del').addEventListener('click',  e => { e.stopPropagation(); onDelete(item.id); });
  return el;
}

function render() {
  const list = $('bucket-list');
  const order = sortItems(items);

  // FLIP step 1: remember where every existing element is now
  const oldRects = new Map();
  elMap.forEach((el, id) => oldRects.set(id, el.getBoundingClientRect()));

  const seen = new Set();
  order.forEach(item => {
    seen.add(item.id);
    let el = elMap.get(item.id);
    const isNew = !el;
    if (isNew) { el = makeEl(item); elMap.set(item.id, el); }
    el.querySelector('.txt').textContent = item.text;
    el.dataset.id = item.id;
    if (item.done) {
      if (!el.classList.contains('done')) {
        if (isNew) el.classList.add('preset');   // already-done on load → no draw animation
        el.classList.add('done');
      }
    } else {
      el.classList.remove('done');
    }
    list.appendChild(el);   // append = move existing node into the right order
  });

  // drop removed items
  elMap.forEach((el, id) => { if (!seen.has(id)) { el.remove(); elMap.delete(id); } });

  updateCounter();
  // empty / error messaging (never a blank page)
  if (!errored) {
    if (order.length === 0) showMsg('nothing here yet — add the first thing ♡');
    else hideMsg();
  }

  // FLIP step 2 + cleanup, next frame
  requestAnimationFrame(() => {
    elMap.forEach(el => { el.classList.remove('preset'); el.classList.remove('enter'); });
    elMap.forEach((el, id) => {
      const o = oldRects.get(id); if (!o) return;      // brand-new items just fade in
      const n = el.getBoundingClientRect();
      const dy = o.top - n.top;
      if (Math.abs(dy) < 1) return;
      el.style.transition = 'none';
      el.style.transform = 'translateY(' + dy + 'px)';
      requestAnimationFrame(() => { el.style.transition = ''; el.style.transform = ''; });
    });
  });
}

function updateCounter() {
  const done = items.filter(i => i.done).length;
  const togo = items.length - done;
  $('bucket-count').textContent = togo + ' to go · ' + done + ' done';
}
function showMsg(t) { const m = $('bucket-msg'); m.textContent = t; m.hidden = false; }
function hideMsg() { $('bucket-msg').hidden = true; }

/* ============================================================
   ACTIONS (optimistic local update → persist → realtime reconciles)
   ============================================================ */
async function addItem() {
  const inp = $('add-input');
  let text = inp.value.trim();
  if (!text) return;
  if (text.length > 200) text = text.slice(0, 200);
  inp.value = '';

  const tmp = { id: 'tmp_' + Math.random().toString(36).slice(2, 9), text,
    done: false, created_at: new Date().toISOString(), done_at: null };
  items.push(tmp);
  render();
  if (!sb) return;
  try {
    const { data, error } = await sb.from('bucket_items').insert({ text }).select().single();
    if (error) throw error;
    const idx = items.findIndex(i => i.id === tmp.id);
    if (idx >= 0) items[idx] = normalize(data); else items.push(normalize(data));
    render();
  } catch (e) {
    console.warn('[bucket] insert failed', e);
    items = items.filter(i => i.id !== tmp.id);     // rollback
    render();
    showMsg('couldn\'t save that just now — try again ♡');
    setTimeout(() => { if (!errored) hideMsg(); }, 3000);
  }
}

function onDone(id) {
  const item = items.find(i => i.id === id);
  const el = elMap.get(id);
  if (!item || item.done || !el) return;
  animating = true;
  el.classList.add('done');                          // draws the coral line + dims (element persists)
  item.done = true; item.done_at = new Date().toISOString();
  updateCounter();
  persistDone(id, true, item.done_at);
  // let the strike finish, THEN slide it down to the done group
  setTimeout(() => { animating = false; render(); flushPending(); }, 540);
}

function onUndo(id) {
  const item = items.find(i => i.id === id);
  if (!item || !item.done) return;
  item.done = false; item.done_at = null;
  render();                                          // FLIP moves it up; line retracts
  persistDone(id, false, null);
}

function onDelete(id) {
  const item = items.find(i => i.id === id);
  if (!item) return;
  if (!confirm('remove this one?')) return;
  items = items.filter(i => i.id !== id);
  render();
  persistDelete(id);
}

async function persistDone(id, done, done_at) {
  if (!sb || String(id).startsWith('tmp_')) return;
  const { error } = await sb.from('bucket_items').update({ done, done_at }).eq('id', id);
  if (error) console.warn('[bucket] update failed', error);
}
async function persistDelete(id) {
  if (!sb || String(id).startsWith('tmp_')) return;
  const { error } = await sb.from('bucket_items').delete().eq('id', id);
  if (error) console.warn('[bucket] delete failed', error);
}

/* ============================================================
   REALTIME (live sync between both of us)
   ============================================================ */
function scheduleRefetch() {
  if (animating) { pendingRefetch = true; return; }   // don't interrupt a strike animation
  clearTimeout(refetchTimer);
  refetchTimer = setTimeout(fetchAndRender, 250);
}
function flushPending() { if (pendingRefetch) { pendingRefetch = false; scheduleRefetch(); } }

function subscribeRealtime() {
  if (!sb) return;
  sb.channel('bucket-list-rt')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'bucket_items' }, () => scheduleRefetch())
    .subscribe();
}

/* ============================================================
   PASSCODE GATE
   The site-wide one (see the shared snippet in <head>). One unlock
   anywhere — index, photobooth, here — unlocks the lot.
   ============================================================ */
function setupGate() {
  const gate  = $('gate');
  const input = $('gate-input');
  input.maxLength = PASS_LEN;

  if (gateUnlocked()) { gate.remove(); return; }   // already unlocked on this device

  async function tryCode() {
    if (await gateCheck(input.value)) { gateRemember(); gate.remove(); }
    else gateShake(input);
  }
  $('gate-form').addEventListener('submit', e => { e.preventDefault(); tryCode(); });
  // Numeric keypads have no return key, so submit as soon as the code is long enough.
  input.addEventListener('input', () => { if (input.value.length >= PASS_LEN) tryCode(); });
}

/* ============================================================
   INIT
   ============================================================ */
document.addEventListener('DOMContentLoaded', () => {
  setupGate();
  $('add-btn').addEventListener('click', addItem);
  $('add-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); addItem(); }
  });
  fetchAndRender();
  subscribeRealtime();
});
</script>
